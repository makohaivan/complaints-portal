<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} | Student Complaints Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Complaints Portal</a>
    <div class="d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <span class="text-light small">{{ user.username }}
          <span class="badge bg-secondary">{{ user.get_role_display }}</span></span>
        {% if user.is_student %}
          <a class="btn btn-sm btn-outline-light" href="{% url 'complaint_create' %}">New complaint</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-light">Log out</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-sm btn-light" href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
