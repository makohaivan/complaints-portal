{% extends "base.html" %}
{% block title %}Account temporarily locked{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="alert alert-danger">
      <h1 class="h5">Account temporarily locked</h1>
      <p class="mb-0">There were too many failed login attempts. Please wait one hour and try again,
      or contact the system administrator.</p>
    </div>
  </div>
</div>
{% endblock %}
