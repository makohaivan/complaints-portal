{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3">Log in</h1>
      {% if form.errors %}
        <div class="alert alert-danger">Invalid username or password, or the account is temporarily locked.</div>
      {% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input type="text" name="username" id="id_username" class="form-control" autofocus required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Password</label>
          <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <p class="small text-muted mt-3 mb-0">No account? <a href="{% url 'register' %}">Register as a student</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
